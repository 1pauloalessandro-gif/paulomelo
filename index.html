<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paulo Melo — Fotografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Source+Serif+4:ital,opsz@0,8..60;1,8..60&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-driven>

<!--
  PADRÃO DE IMAGEM:
  ao trocar qualquer placeholder do picsum.photos por uma foto sua,
  use um <img> direto apontando pro arquivo .webp exportado — só é
  necessário o arquivo .webp, não precisa mais gerar um .jpg junto.

  <img src="mudanca-01_janela-sobre-o-vale.webp" alt="Janela sobre o vale">
-->

<nav>
  <div class="nav-inner">
    <a class="brand" href="index.html">Paulo Melo</a>
    <ul class="mono">
      <li><a href="#series">Séries</a></li>
      <li><a href="#contato">Contato</a></li>
    </ul>
  </div>
</nav>

<!-- HERO: imagem trocada pelo painel /admin (coleção "Hero (capa do site)"); este <img> é só o placeholder antes do JS carregar content/hero.json -->
<div class="hero">
  <img src="images/uploads/DSCF9818.webp" alt="Paisagem da Serra da Mantiqueira">
  <div class="hero-caption">
    <p class="title display">Paulo<br>Melo</p>
  </div>
</div>

<!-- FRONTISPÍCIO -->
<section class="statement">
  <p>A fotografia sempre foi sobre aprender a ver.</p>
</section>

<!-- ÍNDICE DE SÉRIES: cada capa leva pra uma página própria (serie-x.html) -->
<section class="series-index" id="series">
  <div class="series-index-layout">
    <aside class="series-menu series-menu--home">
      <span class="group-label mono">Séries</span>
      <ul>
        <li><a href="serie-mudanca.html"><span class="n">01</span> Mudança</a></li>
        <li><a href="serie-autoral.html"><span class="n">02</span> Autoral</a></li>
      </ul>
    </aside>
    <div class="series-index-grid">
      <a class="series-card" href="serie-mudanca.html">
        <img src="https://picsum.photos/seed/xavier-capa1/900/700" alt="Capa da série Mudança">
        <div class="label">
          <p class="name">Mudança</p>
          <p class="meta mono">São Francisco Xavier — 2026 — 6 imagens</p>
        </div>
      </a>
      <a class="series-card" href="serie-autoral.html">
        <img src="https://picsum.photos/seed/xavier-capa2/900/700" alt="Capa da série Autoral">
        <div class="label">
          <p class="name">Autoral</p>
          <p class="meta mono">2025–2026 — 4 imagens</p>
        </div>
      </a>
      <!--
        Pra adicionar uma nova série:
        1. copie serie-autoral.html e renomeie (ex: serie-nome.html)
        2. adicione um novo <a class="series-card"> aqui na grade, E um item em .series-menu (aside) logo acima
        3. adicione o link dela no menu de séries (.series-menu) de TODAS as páginas de série
      -->
    </div>
  </div>
</section>

<!-- CONTATO -->
<footer id="contato">
  <span class="kicker mono">Contato</span>
  <p class="contact-line">
    <a class="email" href="https://instagram.com/paulo_alessandro" target="_blank" rel="noopener">@paulo_alessandro</a>
    <span class="sep mono">·</span>
    <a class="email" href="https://instagram.com/acervo.paulomelo" target="_blank" rel="noopener">@acervo.paulomelo</a>
  </p>
  <p class="copyright mono">© 2026 Paulo Melo</p>
</footer>

<script src="script.js"></script>
<script src="data.js"></script>
<script>
  loadHero();
  renderHomeSeries();
</script>
</body>
</html>
