<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Paulo Melo — Fotografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Source+Serif+4:ital,opsz@0,8..60;1,8..60&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<body data-driven>

<!--
  PADRÃO DE IMAGEM:
  ao trocar qualquer placeholder do picsum.photos por uma foto sua,
  use um <img> direto apontando pro arquivo .webp exportado — só é
  necessário o arquivo .webp, não precisa mais gerar um .jpg junto.

  <img src="mudanca-01_janela-sobre-o-vale.webp" alt="Janela sobre o vale">
-->

<nav>
  <div class="nav-inner">
    <a class="brand" href="index.html">Paulo Melo</a>
    <ul class="mono">
      <li><a href="#series">Séries</a></li>
      <li><a href="#contato">Contato</a></li>
    </ul>
  </div>
</nav>

<!-- HERO: foto ESTÁTICA, uma pro computador (content/hero-desktop.json, pasta images/uploads/hero-desktop/) e outra pro celular (content/hero.json, pasta images/uploads/hero-mobile/) — decidido e montado por loadHero() (data.js). Só um dos dois blocos abaixo fica visível por vez (ver media query em styles.css). -->
<div class="hero-desktop" id="heroDesktop">
  <img id="heroDesktopImg" alt="">
  <div class="hero-desktop-scrim">
    <p class="hero-desktop-title display">Paulo<br>Melo</p>
  </div>
</div>
<div class="hero-single" id="heroSingle">
  <img id="heroSingleImg" alt="">
  <div class="hero-single-scrim">
    <p class="hero-single-title display">Paulo<br>Melo</p>
  </div>
</div>

<!-- FRONTISPÍCIO -->
<section class="statement">
  <p>A fotografia sempre foi sobre aprender a ver.</p>
</section>

<!-- ÍNDICE DE SÉRIES: cada capa leva pra uma página própria (serie-x.html) -->
<section class="series-index" id="series">
  <div class="series-index-layout">
    <aside class="series-menu series-menu--home">
      <span class="group-label mono">Séries</span>
      <ul>
        <li><a href="serie-janela-do-meu-escritorio.html"><span class="n">01</span> Janela do meu escritório</a></li>
        <li><a href="serie-flores-e-suas-cores.html"><span class="n">02</span> Flores e suas cores</a></li>
        <li><a href="serie-o-que-fica.html"><span class="n">03</span> Projeto: O que fica</a></li>
      </ul>
    </aside>
    <div class="series-index-grid">
      <!-- preenchido dinamicamente por renderHomeSeries() (data.js) a partir de content/series-index.json — sem placeholder aqui pra não piscar imagem errada antes do JS carregar -->
    </div>
  </div>
</section>

<!-- CONTATO -->
<footer id="contato">
  <span class="kicker mono">Contato</span>
  <p class="contact-line">
    <a class="email" href="https://instagram.com/paulo_alessandro" target="_blank" rel="noopener">@paulo_alessandro</a>
    <span class="sep mono">·</span>
    <a class="email" href="https://instagram.com/acervo.paulomelo" target="_blank" rel="noopener">@acervo.paulomelo</a>
  </p>
  <p class="copyright mono">© 2026 Paulo Melo</p>
</footer>

<script src="script.js"></script>
<script src="data.js"></script>

  loadHero();
  renderHomeSeries();
</script>
</body>
</html>
